<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Athlos Forge</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .admin-page {
            padding-top: 140px;
            min-height: 100vh;
        }

        .admin-sidebar {
            background: #121212;
            border-right: 1px solid rgba(212, 175, 55, 0.2);
            min-height: calc(100vh - 140px);
            padding: 20px 0;
        }

        .admin-sidebar .nav-link {
            color: #ccc;
            padding: 12px 20px;
            border-left: 3px solid transparent;
            transition: all 0.2s;
        }

        .admin-sidebar .nav-link:hover,
        .admin-sidebar .nav-link.active {
            color: #D4AF37;
            background: rgba(212, 175, 55, 0.08);
            border-left-color: #D4AF37;
        }

        .admin-sidebar .nav-link i {
            width: 24px;
            margin-right: 8px;
        }

        .admin-content {
            padding: 25px;
        }

        .stat-card {
            background: #1a1a1a;
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }

        .stat-card .stat-number {
            font-size: 2em;
            font-weight: 900;
            color: #D4AF37;
        }

        .stat-card .stat-label {
            color: #aaa;
            font-size: 0.85em;
            text-transform: uppercase;
        }

        .admin-table {
            background: #1a1a1a;
            border-radius: 8px;
            overflow: hidden;
        }

        .admin-table table {
            margin-bottom: 0;
        }

        .admin-table th {
            background: #0d0d0d;
            color: #D4AF37;
            border-color: rgba(212, 175, 55, 0.15);
            font-size: 0.85em;
            text-transform: uppercase;
        }

        .admin-table td {
            color: #ddd;
            border-color: rgba(255, 255, 255, 0.05);
            vertical-align: middle;
        }

        .badge-estado {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.75em;
            font-weight: 600;
        }

        .badge-pendiente { background: #ffc107; color: #000; }
        .badge-confirmado { background: #17a2b8; color: #fff; }
        .badge-enviado { background: #6f42c1; color: #fff; }
        .badge-entregado { background: #28a745; color: #fff; }
        .badge-cancelado { background: #dc3545; color: #fff; }
        .badge-activo { background: #28a745; color: #fff; }
        .badge-inactivo { background: #6c757d; color: #fff; }
        .badge-bloqueado { background: #dc3545; color: #fff; }

        .btn-gold-sm {
            background: linear-gradient(135deg, #D4AF37, #B8860B);
            color: #1a1a1a;
            border: none;
            font-weight: 600;
            font-size: 0.8em;
            padding: 4px 12px;
        }

        .btn-gold-sm:hover {
            background: linear-gradient(135deg, #e6c347, #c9971c);
            color: #000;
        }

        .modal-admin .modal-content {
            background: #1a1a1a;
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: #fff;
        }

        .modal-admin .modal-header {
            border-color: rgba(212, 175, 55, 0.2);
        }

        .modal-admin .modal-footer {
            border-color: rgba(212, 175, 55, 0.2);
        }

        .modal-admin .form-control,
        .modal-admin .form-select {
            background: #2d2d2d;
            border-color: rgba(212, 175, 55, 0.2);
            color: #fff;
        }

        .admin-loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }

        .admin-loading .spinner-border {
            color: #D4AF37;
        }
    </style>
</head>

<body>
    <!-- NAVEGACIÓN -->
    <nav class="navbar navbar-dark navbar-expand-lg fixed-top">
        <div class="container-fluid d-flex justify-content-between align-items-center ps-3 pe-3">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <img src="img/logo-athlos.png" alt="Athlos Forge Logo">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto gap-4">
                    <li class="nav-item"><a class="nav-link text-white fw-bold" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link text-white fw-bold" href="entrenamientos.html">Entrenamientos</a></li>
                    <li class="nav-item"><a class="nav-link text-white fw-bold" href="blog.html">Blog</a></li>
                    <li class="nav-item"><a class="nav-link text-white fw-bold" href="opiniones.html">Opiniones</a></li>
                </ul>
            </div>
            <div class="ms-auto d-flex align-items-center gap-3">
                <span class="text-gold-flat fw-bold" id="userGreeting" style="display:none;white-space:nowrap;"></span>
                <button class="btn btn-danger fw-bold" id="logoutNavItem" onclick="logout()" style="padding:10px 25px;font-size:0.9rem;">Salir</button>
            </div>
        </div>
    </nav>

    <!-- PÁGINA ADMIN -->
    <div class="admin-page">
        <div class="container-fluid">
            <div class="row">
                <!-- SIDEBAR -->
                <div class="col-md-2 admin-sidebar">
                    <h6 class="text-gold-flat px-3 mb-3"><i class="bi bi-shield-lock"></i> ADMIN PANEL</h6>
                    <nav class="nav flex-column">
                        <a class="nav-link active" href="#" data-section="dashboard" onclick="cambiarSeccion('dashboard', this)">
                            <i class="bi bi-speedometer2"></i> Dashboard
                        </a>
                        <a class="nav-link" href="#" data-section="productos" onclick="cambiarSeccion('productos', this)">
                            <i class="bi bi-box-seam"></i> Productos
                        </a>
                        <a class="nav-link" href="#" data-section="categorias" onclick="cambiarSeccion('categorias', this)">
                            <i class="bi bi-tags"></i> Categorías
                        </a>
                        <a class="nav-link" href="#" data-section="pedidos" onclick="cambiarSeccion('pedidos', this)">
                            <i class="bi bi-cart-check"></i> Pedidos
                        </a>
                        <a class="nav-link" href="#" data-section="usuarios" onclick="cambiarSeccion('usuarios', this)">
                            <i class="bi bi-people"></i> Usuarios
                        </a>
                    </nav>
                </div>

                <!-- CONTENIDO PRINCIPAL -->
                <div class="col-md-10 admin-content" id="adminContent">
                    <div class="admin-loading">
                        <div class="spinner-border" role="status"></div>
                        <p class="mt-2">Cargando panel...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL: Editar/Crear Producto -->
    <div class="modal fade modal-admin" id="modalProducto" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title text-gold-flat" id="modalProductoTitulo">Nuevo Producto</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formProducto">
                        <input type="hidden" id="prodId">
                        <div class="mb-3">
                            <label class="form-label small text-uppercase">Nombre</label>
                            <input type="text" class="form-control" id="prodNombre" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-uppercase">Descripción</label>
                            <textarea class="form-control" id="prodDescripcion" rows="2"></textarea>
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label small text-uppercase">Precio (€)</label>
                                <input type="number" class="form-control" id="prodPrecio" step="0.01" min="0" required>
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label small text-uppercase">Stock</label>
                                <input type="number" class="form-control" id="prodStock" min="0" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-uppercase">Categoría</label>
                            <select class="form-select" id="prodCategoria" required>
                                <option value="">Seleccionar...</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-uppercase">URL Imagen</label>
                            <input type="text" class="form-control" id="prodImagen">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-gold-sm px-4 py-2" onclick="guardarProducto()">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL: Detalle de Pedido -->
    <div class="modal fade modal-admin" id="modalPedido" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title text-gold-flat" id="modalPedidoTitulo">Detalle del Pedido</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="modalPedidoBody">
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/admin.js"></script>
</body>

</html>
